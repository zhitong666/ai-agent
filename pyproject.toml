[project]
name = "ai-job-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alex", email = "1938782639@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26.1",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp[cli]>=2.2.0",
    "numpy>=2.5.2",
    "openai>=3.1.0",
    "prometheus-client>=0.21,<1",
    "psycopg[binary,pool]>=3.3.5",
    "pwdlib[argon2]>=0.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.8,<3",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "redis>=5,<6",
    "sentence-transformers>=6.0.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
ai-job-agent = "ai_job_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "locust>=2.32.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"app/auth_dependencies.py" = ["B008"]
"app/auth_router.py" = ["B008"]
"app/main.py" = ["B008"]
