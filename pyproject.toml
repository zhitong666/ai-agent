[project]
name = "ai-job-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alex", email = "1938782639@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "openai>=3.1.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=6.0.0",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
ai-job-agent = "ai_job_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
