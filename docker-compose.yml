name: ai-job-agent

x-app-environment: &app-environment
  OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
  OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
  LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-10}
  HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
  HF_HOME: /app/.cache/huggingface
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
  TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
  VECTOR_STORE: ${VECTOR_STORE:-chroma}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  RERANK_ENABLED: ${RERANK_ENABLED:-true}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
  DATABASE_URL: postgresql://${POSTGRES_USER:-ai_agent}:${POSTGRES_PASSWORD:-ai_agent}@postgres:5432/${POSTGRES_DB:-ai_job_agent}
  REDIS_URL: redis://redis:6379/0

  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ai-job-agent}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

  LLM_COST_BUDGET_USD: ${LLM_COST_BUDGET_USD:-0}
  LLM_CACHE_ENABLED: ${LLM_CACHE_ENABLED:-false}
  LLM_CACHE_TTL_SECONDS: ${LLM_CACHE_TTL_SECONDS:-300}
  LLM_FALLBACK_MODELS_CSV: ${LLM_FALLBACK_MODELS_CSV:-deepseek-reasoner}

services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_VERSION:-16-alpine}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_agent}
      POSTGRES_DB: ${POSTGRES_DB:-ai_job_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:${REDIS_IMAGE_VERSION:-7-alpine}
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:${QDRANT_IMAGE_VERSION:-v1.12.6}
    profiles: ["qdrant"]
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      <<: *app-environment
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/app/.cache/huggingface:ro
      - chroma_data:/app/data/chroma
      - shared_memory_data:/app/data/shared_memory
      - langgraph_data:/app/data/langgraph_checkpoints
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        ".venv/bin/python -m app.db_cli migrate && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      <<: *app-environment
    volumes:
      - chroma_data:/app/data/chroma
      - hf_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          ".venv/bin/python -c \"import os, redis; redis.Redis.from_url(os.environ['REDIS_URL']).ping()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: [".venv/bin/arq", "app.worker.WorkerSettings"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  hf_cache:
  shared_memory_data:
  langgraph_data:
  qdrant_data: